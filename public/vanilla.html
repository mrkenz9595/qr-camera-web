<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Video Recorder (Vanilla JS)</title>
  <!-- Tailwind CSS qua CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Thư viện quét mã QR html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    /* Ẩn thanh cuộn nhưng vẫn cuộn được */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none">

  <!-- HEADER -->
  <header class="bg-slate-800/90 border-b border-slate-700/80 sticky top-0 z-40 backdrop-blur px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-600/30">
        QR
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">QR Video Recorder</h1>
        <p class="text-[10px] text-slate-400">Quét lần 1: Quay • Quét lần 2: Dừng & Lưu</p>
      </div>
    </div>
    <div id="statusBadge" class="flex items-center space-x-1.5 bg-slate-700/60 border border-slate-600/50 px-2.5 py-1 rounded-full text-xs font-semibold text-slate-300">
      <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
      <span id="statusText">Chờ quét</span>
    </div>
  </header>

  <!-- NỘI DUNG CHÍNH (MAIN CONTAINER) -->
  <main class="flex-1 max-w-lg mx-auto w-full p-3 flex flex-col space-y-3 pb-20">

    <!-- ========================================== -->
    <!-- TAB 1: MÁY QUÉT & GHI HÌNH (SCANNER & RECORDER) -->
    <!-- ========================================== -->
    <section id="tabScanner" class="flex flex-col space-y-3 flex-1">
      
      <!-- Hướng dẫn & Cảnh báo trạng thái -->
      <div id="infoBanner" class="bg-blue-950/50 border border-blue-800/40 rounded-xl p-3 text-xs flex items-center space-x-2.5">
        <span class="text-xl">📸</span>
        <div class="flex-1">
          <div id="bannerTitle" class="font-semibold text-blue-300">Bước 1: Quét mã QR lần 1</div>
          <div id="bannerDesc" class="text-slate-400 mt-0.5">Đưa mã QR/Barcode vào khung để bắt đầu ghi hình.</div>
        </div>
      </div>

      <!-- Khung Camera & QR Scanner -->
      <div class="relative w-full aspect-square bg-black rounded-2xl overflow-hidden border-2 border-slate-700 shadow-xl flex items-center justify-center">
        <!-- Vùng render html5-qrcode -->
        <div id="qr-reader" class="w-full h-full [&_video]:object-cover [&_video]:w-full [&_video]:h-full"></div>

        <!-- Khung ngắm quét mã -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center p-8">
          <div id="viewFinder" class="w-3/4 h-3/4 border-2 border-emerald-400/70 rounded-2xl relative transition-all duration-300 shadow-inner">
            <div class="absolute -top-1 -left-1 w-5 h-5 border-t-4 border-l-4 border-emerald-400 rounded-tl"></div>
            <div class="absolute -top-1 -right-1 w-5 h-5 border-t-4 border-r-4 border-emerald-400 rounded-tr"></div>
            <div class="absolute -bottom-1 -left-1 w-5 h-5 border-b-4 border-l-4 border-emerald-400 rounded-bl"></div>
            <div class="absolute -bottom-1 -right-1 w-5 h-5 border-b-4 border-r-4 border-emerald-400 rounded-br"></div>
            <div class="w-full h-0.5 bg-emerald-400 opacity-75 animate-bounce absolute top-1/2"></div>
          </div>
        </div>

        <!-- Màn hình Loading khi tải lên server -->
        <div id="uploadOverlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 z-30 text-center">
          <div class="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-400 rounded-full animate-spin mb-3"></div>
          <div class="font-bold text-white text-sm mb-1">Đang tải video lên server...</div>
          <div id="uploadSubtext" class="text-xs text-slate-400 max-w-xs">Vui lòng chờ trong giây lát</div>
        </div>
      </div>

      <!-- Điều khiển khi đang quay -->
      <div id="recordingControls" class="hidden grid grid-cols-2 gap-2">
        <button id="btnManualStop" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-red-900/40 text-xs transition">
          ⏹️ Dừng quay & Lưu
        </button>
        <button id="btnCancelRecord" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-3 rounded-xl border border-slate-700 text-xs transition">
          ✖ Hủy bỏ
        </button>
      </div>

      <!-- Giả lập quét nhanh (Testing Shortcut) -->
      <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-2.5">
        <div class="text-[11px] text-slate-400 mb-1.5">⚡ Thử nghiệm nhanh (Không cần in mã giấy):</div>
        <div class="flex flex-wrap gap-1.5">
          <button onclick="simulateScan('SP-IPHONE-15')" class="text-[11px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200">Quét "SP-IPHONE-15"</button>
          <button onclick="simulateScan('DON-HANG-9921')" class="text-[11px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200">Quét "DON-HANG-9921"</button>
        </div>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- TAB 2: QUẢN LÝ VIDEO (DASHBOARD) -->
    <!-- ========================================== -->
    <section id="tabDashboard" class="hidden flex-col space-y-3 flex-1">
      <!-- Thanh tìm kiếm & Làm mới -->
      <div class="flex items-center space-x-2">
        <div class="relative flex-1">
          <input
            id="searchInput"
            type="text"
            placeholder="Tìm theo nội dung mã QR..."
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <button id="btnRefresh" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 rounded-xl text-xs flex items-center space-x-1">
          <span>🔄</span>
          <span>Làm mới</span>
        </button>
      </div>

      <!-- Danh sách video dạng Grid -->
      <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Render danh sách video bằng JavaScript -->
      </div>
    </section>
  </main>

  <!-- THANH ĐIỀU HƯỚNG DƯỚI (BOTTOM NAVIGATION TABS) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 backdrop-blur z-40 max-w-lg mx-auto flex items-center justify-around py-2">
    <button id="navTabScanner" class="flex flex-col items-center py-1 px-4 text-indigo-400 font-semibold text-xs">
      <span class="text-lg">📷</span>
      <span>Máy quét & Ghi hình</span>
    </button>
    <button id="navTabDashboard" class="flex flex-col items-center py-1 px-4 text-slate-400 hover:text-slate-200 font-semibold text-xs">
      <span class="text-lg">📁</span>
      <span>Quản lý Video</span>
    </button>
  </nav>

  <!-- MODAL XEM TRỰC TIẾP VIDEO -->
  <div id="videoModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full overflow-hidden flex flex-col">
      <div class="flex items-center justify-between p-3 border-b border-slate-800">
        <span id="modalTitle" class="text-xs font-mono font-bold text-emerald-400 truncate"></span>
        <button onclick="closeVideoModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">&times;</button>
      </div>
      <div class="bg-black flex items-center justify-center max-h-[60vh]">
        <video id="modalVideoPlayer" controls class="w-full max-h-[60vh] object-contain"></video>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT THUẦN (VANILLA JS) -->
  <script>
    // Trạng thái ứng dụng
    let currentStatus = 'idle'; // 'idle' | 'recording' | 'uploading'
    let currentQrCode = '';
    let mediaRecorder = null;
    let recordedChunks = [];
    let isCooldown = false;
    let html5QrCode = null;
    let timerInterval = null;
    let secondsElapsed = 0;
    let allVideos = [];

    // Âm thanh Bíp giả lập bằng Web Audio API
    function playBeep(type = 'start') {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'start') {
          osc.frequency.setValueAtTime(1200, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else {
          osc.frequency.setValueAtTime(1800, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        }
      } catch (e) {
        console.warn('Audio context error:', e);
      }
    }

    // Khởi tạo máy quét mã QR
    async function initScanner() {
      try {
        html5QrCode = new Html5Qrcode("qr-reader");
        const config = { fps: 15, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };

        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText) => handleQrScanned(decodedText),
          (error) => {} // Bỏ qua lỗi nhận diện từng frame
        );
      } catch (err) {
        console.error("Lỗi camera:", err);
        alert("Vui lòng cấp quyền Camera trên trình duyệt di động để quét mã.");
      }
    }

    // Xử lý logic 2 lần quét
    async function handleQrScanned(qrText) {
      if (currentStatus === 'idle') {
        // LẦN 1: BẮT ĐẦU GHI HÌNH
        currentQrCode = qrText;
        currentStatus = 'recording';
        playBeep('start');

        // Bắt đầu ghi hình camera
        await startMediaRecording();

        // Cập nhật giao diện
        updateUiState();

        // Bật cooldown 2.5s để tránh quét lặp mã lần 1
        isCooldown = true;
        setTimeout(() => { isCooldown = false; }, 2500);

      } else if (currentStatus === 'recording') {
        // LẦN 2: DỪNG GHI HÌNH VÀ LƯU
        if (isCooldown) return; // Bỏ qua nếu chưa hết cooldown
        stopMediaRecording();
      }
    }

    // Bắt đầu MediaRecorder từ video stream
    async function startMediaRecording() {
      try {
        const videoEl = document.querySelector('#qr-reader video');
        let stream = videoEl && videoEl.srcObject instanceof MediaStream ? videoEl.srcObject : null;
        if (!stream) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        }

        recordedChunks = [];
        const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
        mediaRecorder = new MediaRecorder(stream, { mimeType });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => uploadVideo();
        mediaRecorder.start(500);

        secondsElapsed = 0;
        timerInterval = setInterval(() => {
          secondsElapsed++;
          const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
          const secs = String(secondsElapsed % 60).padStart(2, '0');
          document.getElementById('statusText').innerText = `Đang quay (${mins}:${secs})`;
        }, 1000);

      } catch (e) {
        console.error("Lỗi MediaRecorder:", e);
        alert("Lỗi khi ghi hình: " + e.message);
        currentStatus = 'idle';
        updateUiState();
      }
    }

    // Dừng MediaRecorder
    function stopMediaRecording() {
      if (timerInterval) clearInterval(timerInterval);
      playBeep('stop');
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      currentStatus = 'uploading';
      updateUiState();
    }

    // Đóng gói FormData và upload video lên API
    async function uploadVideo() {
      const overlay = document.getElementById('uploadOverlay');
      overlay.classList.remove('hidden');

      try {
        const ext = MediaRecorder.isTypeSupported('video/mp4') ? '.mp4' : '.webm';
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
        const fileName = `${currentQrCode.trim() || 'QR_Video'}${ext}`;

        const formData = new FormData();
        formData.append('video', blob, fileName);
        formData.append('qrCode', currentQrCode);

        const res = await fetch('/api/upload-video', {
          method: 'POST',
          body: formData,
        });

        const data = await res.json();
        if (data.success) {
          alert(`Đã lưu video thành công: ${data.video.filename}`);
          loadVideos();
        } else {
          alert('Lỗi tải video: ' + data.message);
        }
      } catch (err) {
        alert('Lỗi khi gửi video lên server: ' + err.message);
      } finally {
        currentStatus = 'idle';
        currentQrCode = '';
        overlay.classList.add('hidden');
        updateUiState();
      }
    }

    // Cập nhật trạng thái giao diện UI
    function updateUiState() {
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      const bannerTitle = document.getElementById('bannerTitle');
      const bannerDesc = document.getElementById('bannerDesc');
      const recControls = document.getElementById('recordingControls');
      const viewFinder = document.getElementById('viewFinder');

      if (currentStatus === 'idle') {
        statusText.innerText = 'Chờ quét lần 1';
        bannerTitle.innerText = 'Bước 1: Quét mã QR lần 1';
        bannerDesc.innerText = 'Đưa mã QR/Barcode vào khung để bắt đầu ghi hình.';
        recControls.classList.add('hidden');
        viewFinder.className = 'w-3/4 h-3/4 border-2 border-emerald-400/70 rounded-2xl relative shadow-inner';
      } else if (currentStatus === 'recording') {
        statusText.innerText = 'Đang quay video...';
        bannerTitle.innerText = `🔴 Đang quay cho mã: ${currentQrCode}`;
        bannerDesc.innerText = 'Đưa mã QR lần 2 vào để DỪNG ghi hình và lưu video.';
        recControls.classList.remove('hidden');
        viewFinder.className = 'w-3/4 h-3/4 border-2 border-red-500/80 rounded-2xl relative shadow-inner';
      }
    }

    // Tải danh sách video từ API GET /api/videos
    async function loadVideos() {
      try {
        const res = await fetch('/api/videos');
        const data = await res.json();
        if (data.success) {
          allVideos = data.videos || [];
          renderVideos();
        }
      } catch (e) {
        console.error("Lỗi lấy danh sách video:", e);
      }
    }

    // Render danh sách video ra Grid
    function renderVideos() {
      const grid = document.getElementById('videoGrid');
      const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const filtered = allVideos.filter(v => (v.originalQr || '').toLowerCase().includes(query) || v.filename.toLowerCase().includes(query));

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-8 text-center text-slate-400 text-xs">Chưa có video nào phù hợp.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(v => `
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex flex-col space-y-2">
          <div class="text-xs font-bold text-emerald-400 truncate">QR: ${v.originalQr}</div>
          <div class="text-[11px] text-slate-400 truncate">${v.filename}</div>
          <div class="text-[10px] text-slate-500">${(v.size / (1024*1024)).toFixed(2)} MB • ${new Date(v.createdAt).toLocaleTimeString()}</div>
          <div class="grid grid-cols-3 gap-1 pt-1">
            <button onclick="playVideo('${v.url}', '${v.originalQr}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-1 rounded">Xem</button>
            <a href="${v.url}" download="${v.filename}" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-1 rounded text-center">Tải</a>
            <button onclick="deleteVideo('${v.filename}')" class="bg-rose-600 hover:bg-rose-500 text-white text-xs py-1 rounded">Xóa</button>
          </div>
        </div>
      `).join('');
    }

    // Xóa video qua API DELETE /api/videos/:filename
    async function deleteVideo(filename) {
      if (!confirm(`Bạn có chắc muốn xóa vĩnh viễn video "${filename}"?`)) return;
      try {
        const res = await fetch(`/api/videos/${encodeURIComponent(filename)}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          loadVideos();
        } else {
          alert('Lỗi xóa video: ' + data.message);
        }
      } catch (e) {
        alert('Lỗi kết nối khi xóa: ' + e.message);
      }
    }

    // Xem video trong modal
    function playVideo(url, title) {
      document.getElementById('modalTitle').innerText = title;
      const player = document.getElementById('modalVideoPlayer');
      player.src = url;
      player.play();
      document.getElementById('videoModal').classList.remove('hidden');
    }

    function closeVideoModal() {
      const player = document.getElementById('modalVideoPlayer');
      player.pause();
      player.src = '';
      document.getElementById('videoModal').classList.add('hidden');
    }

    // Giả lập quét
    function simulateScan(code) {
      handleQrScanned(code);
    }

    // Điều hướng Tab
    const tabScanner = document.getElementById('tabScanner');
    const tabDashboard = document.getElementById('tabDashboard');
    const navTabScanner = document.getElementById('navTabScanner');
    const navTabDashboard = document.getElementById('navTabDashboard');

    navTabScanner.onclick = () => {
      tabScanner.classList.remove('hidden');
      tabDashboard.classList.add('hidden');
      navTabScanner.className = 'flex flex-col items-center py-1 px-4 text-indigo-400 font-semibold text-xs';
      navTabDashboard.className = 'flex flex-col items-center py-1 px-4 text-slate-400 hover:text-slate-200 font-semibold text-xs';
    };

    navTabDashboard.onclick = () => {
      tabScanner.classList.add('hidden');
      tabDashboard.classList.remove('hidden');
      navTabDashboard.className = 'flex flex-col items-center py-1 px-4 text-indigo-400 font-semibold text-xs';
      navTabScanner.className = 'flex flex-col items-center py-1 px-4 text-slate-400 hover:text-slate-200 font-semibold text-xs';
      loadVideos();
    };

    document.getElementById('btnRefresh').onclick = loadVideos;
    document.getElementById('searchInput').oninput = renderVideos;
    document.getElementById('btnManualStop').onclick = stopMediaRecording;
    document.getElementById('btnCancelRecord').onclick = () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      currentStatus = 'idle';
      updateUiState();
    };

    // Khởi động
    window.addEventListener('DOMContentLoaded', () => {
      initScanner();
      loadVideos();
    });
  </script>
</body>
</html>
