version: '3.8'

version: '3.8'

services:
  qr-camera-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr-camera-web
    ports:
      - "5000:5000"
    volumes:
      # Mount uploads để lưu video persistent
      - ./uploads:/app/uploads
      # Mount ssl để giữ chứng chỉ khi restart
      - ./ssl:/app/ssl
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SSL_KEY_PATH=/app/ssl/key.pem
      - SSL_CERT_PATH=/app/ssl/cert.pem
    restart: unless-stopped
    networks:
      - qr-network
    # Giới hạn tài nguyên
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 256M
    # Cấu hình log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/server-info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  qr-network:
    driver: bridge
